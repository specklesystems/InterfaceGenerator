name: "Deploy to Nuget.org"

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - id: set-version
        name: Set version from tag
        run: |
          SEMVER="${{ github.ref_name }}"
          FILE_VERSION="$(echo "$SEMVER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/').${{ github.run_number }}"

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "fileVersion=$FILE_VERSION" >> "$GITHUB_OUTPUT"

          echo "$SEMVER"
          echo "$FILE_VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version="$SEMVER" -p:FileVersion="$FILE_VERSION"
        env:
          SEMVER: ${{ steps.set-version.outputs.semver }}
          FILE_VERSION: ${{ steps.set-version.outputs.fileVersion }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release Speckle.InterfaceGenerator/Speckle.InterfaceGenerator.csproj --output . -p:Version="$SEMVER"
        env:
          SEMVER: ${{ steps.set-version.outputs.semver }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push *.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
